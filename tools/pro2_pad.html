<defs>

      --merge:#cc97e5; --merge-soft:#e8d0f3; --merge-deep:#a77cbc; --merge-edge:#8f6aa0; --merge-glow:rgba(204,151,229,.5); }

    .stick.active .stick-lip, .stick.pressed .stick-lip { stroke:var(--pink-edge); }
    .stick.active .stick-cap-lit, .stick.pressed .stick-cap-lit { opacity:1; }
    .stick.active .stick-cap-rim, .stick.pressed .stick-cap-rim { stroke:var(--soft-pink); }

    .stick.chat.active .stick-ring, .stick.chat.pressed .stick-ring { stroke:var(--chat-soft); filter:drop-shadow(0 0 4px var(--chat)); }
    .stick.chat.active .stick-lip, .stick.chat.pressed .stick-lip { stroke:var(--chat-edge); }
    .stick.chat .stick-cap-lit { fill:url(#chatCapGrad); }
    .stick.chat.active .stick-cap-rim, .stick.chat.pressed .stick-cap-rim { stroke:var(--chat-soft); }
    .stick.chat.pressed { filter:drop-shadow(0 0 5px var(--chat-glow)); }
    .pressable.pressed.both .face-key, .pressable.pressed.both .system-core, .pressable.pressed.both .dpad-direction, .pressable.pressed.both .shoulder-base { fill:var(--merge); }
    .pressable.pressed.both { filter:drop-shadow(0 0 5px var(--merge-glow)); }
    .stick.both.active .stick-ring, .stick.both.pressed .stick-ring { stroke:var(--merge-soft); filter:drop-shadow(0 0 4px var(--merge)); }
    .stick.both.active .stick-lip, .stick.both.pressed .stick-lip { stroke:var(--merge-edge); }
    .stick.both .stick-cap-lit { fill:url(#mergeCapGrad); }
    .stick.both.active .stick-cap-rim, .stick.both.pressed .stick-cap-rim { stroke:var(--merge-soft); }
    .stick.both.pressed { filter:drop-shadow(0 0 5px var(--merge-glow)); }
    .status-led { fill:#6c6674; }
    .pressable.pressed *, .stick.active *, .stick.pressed * { transition-duration:.04s; }
    .status-led.on { fill:var(--pink); }
  </style>

<script>
  const STICKS = {
    left: { group: "left-stick", cap: "left-move", cx: 314, cy: 237, click: "LS" },
    right: { group: "right-stick", cap: "right-move", cx: 601, cy: 337, click: "RS" },
  };
  const CAP_TRAVEL = 15;   // how far the cap moves on screen at full deflection
  const DRAG_RADIUS = 43;  // pointer distance from the centre that counts as full deflection
  // Sides currently being dragged on the dashboard; their caps follow the pointer instead of the state.
  const dragging = {};
  const rawUnit = v => Math.max(-1, Math.min(1, (v - 2048) / 1600));

  // x and y run -1..1 with y up; tint is "chat" for chat alone and "both" when streamer and chat share the input.
  function placeCap(side, x, y, tint = "") {
    const { group, cap } = STICKS[side];
    document.getElementById(cap).setAttribute("transform", `translate(${(x * CAP_TRAVEL).toFixed(2)} ${(-y * CAP_TRAVEL).toFixed(2)})`);
    const stick = document.getElementById(group);
    stick.classList.toggle("active", Math.hypot(x, y) > 0.12);
    stick.classList.toggle("chat", tint === "chat");
    stick.classList.toggle("both", tint === "both");
  }

  // show picks whose inputs are drawn: streamer (controller and dashboard clicks), chat, and whether chat is tinted.
  const SHOW_ALL = { streamer: true, chat: true, colors: true };
  function drawPad(s, show = SHOW_ALL) {
    const own = show.streamer ? new Set([...s.buttons, ...s.injected]) : new Set();
    const chatHeld = show.chat ? new Set(s.chat_buttons || []) : new Set();
    document.querySelectorAll("[data-b]").forEach(el => {
      const name = el.dataset.b;
      el.classList.toggle("pressed", own.has(name) || chatHeld.has(name));
      el.classList.toggle("chat", show.colors && chatHeld.has(name) && !own.has(name));
      el.classList.toggle("both", show.colors && chatHeld.has(name) && own.has(name));
    });
    for (const side of ["left", "right"]) {
      const click = STICKS[side].click;
      const clickTint = show.colors && chatHeld.has(click) ? (own.has(click) ? "both" : "chat") : "";
      document.getElementById(STICKS[side].group).classList.toggle("pressed", own.has(click) || chatHeld.has(click));
      if (dragging[side]) continue;
      const chatStick = show.chat && s.chat_sticks && s.chat_sticks[side];
      // A larger raw Y is assumed to mean the stick is pushed up; not yet verified.
      const ownStick = show.streamer ? (s.injected_sticks[side] || [rawUnit(s[side][0]), rawUnit(s[side][1])]) : [0, 0];
      if (chatStick) {
        placeCap(side, chatStick[0], chatStick[1], !show.colors ? "" : Math.hypot(...ownStick) > 0.12 || clickTint === "both" ? "both" : "chat");
      } else {
        placeCap(side, ownStick[0], ownStick[1], clickTint);
      }
    }
  }

  // Requests overlap so the round trip over the SSH tunnel does not limit the refresh rate; stale replies are dropped.
  function startPolling(onState, onError, intervalMs = 33) {
    let inflight = 0, sent = 0, newest = 0;
    setInterval(async () => {
      if (inflight >= 3) return;
      const seq = ++sent;
      inflight++;
      try {
        const s = await (await fetch("/state", { cache: "no-store" })).json();
        if (seq > newest) { newest = seq; onState(s); }
      } catch (e) {
        onError(e);
      } finally {
        inflight--;
      }
    }, intervalMs);
  }
</script>
